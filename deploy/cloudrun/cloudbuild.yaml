steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/cloudrun/Dockerfile
      - -t
      - ${_IMAGE}
      - .
  - name: gcr.io/cloud-builders/docker
    args: [push, ${_IMAGE}]
images:
  - ${_IMAGE}
substitutions:
  _IMAGE: us-east1-docker.pkg.dev/PROJECT_ID/xunihub/xunihub-api:latest
