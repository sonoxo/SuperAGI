name: XuniHub Core CI

on:
  push:
    branches: ["xunihub-launch"]
    paths:
      - "superagi/xunihub/**"
      - "tests/xunihub/**"
      - ".github/workflows/xunihub-core-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xunihub-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Compile XuniHub core
        run: python -m py_compile superagi/xunihub/*.py
      - name: Run XuniHub core tests
        run: python -m pytest -q tests/xunihub
