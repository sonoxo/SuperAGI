name: XuniHub Sonoxo Sales Fabric CI

on:
  push:
    branches: ["xunihub-launch"]
    paths:
      - "superagi/marketing/sonoxo_sales_fabric.py"
      - "superagi/marketing/sonoxo_sales_sprint.py"
      - "superagi/marketing/sonoxo_commerce_evidence.py"
      - "superagi/marketing/sonoxo_signal_ingest.py"
      - "superagi/marketing/sonoxo_growth_metrics.py"
      - "tests/marketing/test_sonoxo_sales_fabric.py"
      - "tests/marketing/test_sonoxo_sales_sprint.py"
      - "tests/marketing/test_sonoxo_signal_ingest.py"
      - "tests/marketing/test_sonoxo_growth_metrics.py"
      - ".github/workflows/xunihub-sales-fabric.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sales-fabric-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile fabric
        run: |
          python -m py_compile superagi/marketing/sonoxo_sales_fabric.py
          python -m py_compile superagi/marketing/sonoxo_sales_sprint.py
          python -m py_compile superagi/marketing/sonoxo_commerce_evidence.py
          python -m py_compile superagi/marketing/sonoxo_signal_ingest.py
          python -m py_compile superagi/marketing/sonoxo_growth_metrics.py
      - name: Run fabric tests
        run: >-
          python -m pytest -q
          tests/marketing/test_sonoxo_sales_fabric.py
          tests/marketing/test_sonoxo_sales_sprint.py
          tests/marketing/test_sonoxo_signal_ingest.py
          tests/marketing/test_sonoxo_growth_metrics.py
