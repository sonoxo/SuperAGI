name: Deploy Sonoxo First-Dollar Campaign

on:
  push:
    branches: [xunihub-launch]
    paths:
      - 'campaigns/sonoxo-first-dollar/**'
      - '.github/workflows/deploy-sonoxo-first-dollar.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sonoxo-first-dollar-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: campaigns/sonoxo-first-dollar
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
