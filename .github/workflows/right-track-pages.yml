name: Right Track Pages
on:
  push:
    branches: [right-track-launch]
    paths:
      - "apps/right-track/**"
      - ".github/workflows/right-track-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: right-track-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/right-track
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
