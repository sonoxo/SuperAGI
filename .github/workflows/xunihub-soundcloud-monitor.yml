name: XuniHub SoundCloud Monitor CI

on:
  push:
    branches: ["xunihub-launch"]
    paths:
      - "superagi/monitoring/**"
      - "tests/monitoring/**"
      - ".github/workflows/xunihub-soundcloud-monitor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install focused dependencies
        run: python -m pip install pytest requests
      - name: Compile monitor
        run: python -m py_compile superagi/monitoring/soundcloud_engagement.py superagi/monitoring/soundcloud_app.py
      - name: Run monitor tests
        run: pytest -q tests/monitoring/test_soundcloud_engagement.py
